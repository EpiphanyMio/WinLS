<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>__LEAFLET_CSS__</style>
<style>html,body,#map{height:100%;margin:0}#notice{position:absolute;z-index:1000;bottom:10px;left:10px;background:white;padding:5px;font:12px sans-serif;border-radius:4px}</style>
</head><body><div id="map"></div><div id="notice">© OpenStreetMap contributors</div>
<script>__QWEBCHANNEL_JS__</script>
<script>__LEAFLET_JS__</script>
<script>
let map, routeLayer, pointLayer, singleLayer, searchLayer, bridge, routePolyline;
let activeDrag=null, suppressClickUntil=0;
const notice=document.getElementById('notice');
if (typeof QWebChannel === 'function' && window.qt && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport, channel => { bridge = channel.objects.bridge; });
} else {
  notice.textContent='地图选点功能未就绪，请重新打开程序。';
}
function init() {
  if (!window.L) {notice.textContent='地图组件加载失败，请重新安装程序。';return;}
  map=L.map('map').setView([39.9042,116.4074],14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,attribution:'© OpenStreetMap contributors'})
    .on('tileerror', () => { notice.textContent='地图底图加载失败，请检查网络或代理。'; })
    .on('tileload', () => { notice.textContent='© OpenStreetMap contributors'; })
    .addTo(map);
  routeLayer=L.layerGroup().addTo(map);pointLayer=L.layerGroup().addTo(map);
  map.on('click', e => {if(bridge&&Date.now()>suppressClickUntil) bridge.mapClicked(e.latlng.lat,e.latlng.lng);});
  map.on('mousemove', e => {
    if(!activeDrag)return;
    activeDrag.marker.setLatLng(e.latlng);
    activeDrag.points[activeDrag.index]={latitude:e.latlng.lat,longitude:e.latlng.lng};
    if(routePolyline){
      const coords=activeDrag.points.map(p=>[p.latitude,p.longitude]);
      if(coords.length>1)coords.push(coords[0]);
      routePolyline.setLatLngs(coords);
    }
  });
  document.addEventListener('mouseup', () => {
    if(!activeDrag)return;
    const drag=activeDrag;
    activeDrag=null;
    map.dragging.enable();
    suppressClickUntil=Date.now()+250;
    const position=drag.marker.getLatLng();
    if(bridge&&(!drag.original.equals(position)))
      bridge.pointMoved(drag.index,position.lat,position.lng);
  });
}
function draw(points, preview, single, search, fit, editable) {
  if(!map)return;
  if(activeDrag){activeDrag=null;map.dragging.enable();}
  pointLayer.clearLayers();routeLayer.clearLayers();
  const path=(preview&&preview.length?preview:points).map(p=>[p.latitude,p.longitude]);
  routePolyline=path.length>1?L.polyline(path,{color:'#0d9488',weight:4}).addTo(routeLayer):null;
  const pointRenderer=points.length>500?L.canvas():undefined;
  points.forEach((p,i)=>{
    const marker=L.circleMarker([p.latitude,p.longitude],{
      radius:editable?7:5,color:'#0d9488',fillOpacity:.9,renderer:pointRenderer
    }).bindTooltip(String(i+1)).addTo(pointLayer);
    if(editable)marker.on('mousedown',e=>{
      L.DomEvent.stop(e.originalEvent);
      map.dragging.disable();
      activeDrag={index:i,marker,points,original:marker.getLatLng()};
      suppressClickUntil=Date.now()+250;
    });
  });
  if(singleLayer)map.removeLayer(singleLayer);if(searchLayer)map.removeLayer(searchLayer);
  if(single)singleLayer=L.circleMarker([single.latitude,single.longitude],{radius:8,color:'#9333ea'}).bindTooltip('单点定位').addTo(map);
  if(search)searchLayer=L.circleMarker([search.latitude,search.longitude],{radius:7,color:'#d97706',fillOpacity:.9}).addTo(map);
  if(fit&&points.length)map.fitBounds(L.latLngBounds(points.map(p=>[p.latitude,p.longitude])).pad(.2),{maxZoom:16});
}
function focus(lat,lon){if(map)map.setView([lat,lon],16)}
init();
</script></body></html>
